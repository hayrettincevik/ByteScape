name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The easiest way is **⋯ → Report a problem** in ByteScape: it fills in this page and saves a
        zip with the details (your user and computer names replaced) that you can drag in below.
        Issues are public. Please report security problems privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Scan C:\
        2. Open "Programs on disk"
        3. ...
  - type: input
    id: version
    attributes:
      label: ByteScape version
      description: ⋯ → About ByteScape
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Which download?
      options:
        - Portable exe (x64, .NET included)
        - Portable exe (uses the installed .NET)
        - Microsoft Store
        - Built from source
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: report
    attributes:
      label: Problem report or screenshots
      description: Drag the zip saved by "Report a problem", or screenshots, here.
